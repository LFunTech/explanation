<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>题目讲解课件</title><style>/*MATH_CSS*/</style><style>/*PLAYER_CSS*/</style></head>
<body><header class="player-header"><div><span class="brand-mark">解</span><strong id="course-title">题目讲解</strong></div><div><span id="source-mode"></span><button id="motion-toggle" aria-pressed="true">动画：开</button><button id="notes-toggle">讲稿</button><button id="reading-jump">完整解析</button><button id="outline-toggle" title="目录">☷ 目录</button><button id="fullscreen" title="全屏">⛶ 全屏</button><button id="print">打印</button></div></header>
<main class="player-layout"><aside id="outline" aria-label="课件目录"></aside><div class="stage-wrap"><div id="slide-viewport"><div id="slide-mount"><section class="slide" id="stage" aria-live="polite"></section></div></div></div></main>
<dialog id="notes-dialog" class="reading-dialog"><div class="dialog-heading"><strong>本页讲稿</strong><button data-close-dialog="notes-dialog" aria-label="关闭讲稿">关闭 ×</button></div><section class="speaker"><div class="speaker-title"><span id="voice-mode"></span></div><div id="notes"></div></section></dialog>
<dialog id="reading-dialog" class="reading-dialog"><div class="dialog-heading"><strong>完整解析与练习</strong><button data-close-dialog="reading-dialog" aria-label="关闭解析">关闭 ×</button></div><section id="reading" aria-label="完整解析与练习"></section></dialog>
<dialog id="figure-dialog"><button id="figure-close" aria-label="关闭大图">关闭 ×</button><img id="figure-image" alt=""><p id="figure-caption"></p></dialog>
<footer class="player-controls"><button id="prev" aria-label="上一页">← 上一页</button><div class="progress-area"><span id="page-number"></span><input id="progress" type="range" min="0" value="0" aria-label="选择页码"></div><button id="speak">▶ 朗读本页</button><label class="autoplay"><input id="auto-next" type="checkbox"> 连续播放</label><button id="next" aria-label="下一页">下一页 →</button></footer><div id="player-message" role="status"></div><section id="print-pages"></section>
<script>/*MATH_JS*/</script><script>/*MATH_AUTO*/</script><script>/*LESSON_DATA*/</script><script>/*PLAYER_JS*/</script></body></html>
